name: Docs site

# Build the requested branch or published release's source. This fork uses
# main; upstream dev pushes remain supported.
on:
  push:
    branches: [main, dev]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      # The reverse-engineering pages render the mod symbol tables and the
      # hook comments.
      - "config/mod/**"
      - "config/rexglue/analysis/main-xex.toml"
      - "src/mod/fh1_symbols*.inc"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r site/requirements.txt
          python site/build.py --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
