name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-source:
    if: github.event.repository.visibility == 'public'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Check repository boundary
        shell: powershell
        run: .\tools\check-repository-boundary.ps1
      - name: Provision the pinned Python
        # The save, crash and title-update wrappers run pinyon.py on the
        # player's pinned runtime (tools/release-common.ps1 Get-PinyonPython).
        shell: powershell
        run: |
          . ./tools/release-common.ps1
          $python = (Get-PinyonReleaseToolchain).python
          $root = Resolve-PinyonLocalPath -RelativePath $python.install_path
          $archive = Join-Path $env:RUNNER_TEMP 'python-embed.zip'
          Invoke-PinyonDownload -Uri $python.url -Destination $archive -Sha256 $python.sha256
          [void](New-Item -ItemType Directory -Force -Path $root)
          Expand-PinyonZip -Archive $archive -Destination $root
      - name: Test release tooling
        run: python -m unittest discover -s tools/tests -p "test_*.py"
      - name: Check shared touch icon paths
        run: |
          python tools/generate-touch-icons.py --check
          python tools/generate-touch-artwork.py --check
      - name: Check tracked Markdown links
        run: python tools/check-markdown-links.py
      - name: Build the docs site
        # Catches broken reverse-engineering records, links and diagrams.
        run: |
          python -m pip install -r site/requirements.txt
          python site/build.py --out "$env:RUNNER_TEMP/site"
      - name: Build launcher
        run: dotnet build launcher/PinyonShift.Launcher/PinyonShift.Launcher.csproj -c Release
      - name: Build Linux and macOS launcher
        run: dotnet build launcher/PinyonShift.Launcher.Desktop/PinyonShift.Launcher.Desktop.csproj -c Release
      - name: Check launcher behavior
        run: python tools/check-launcher.py

  host-tests:
    # The C++ host tests and the sample mod, built without game files
    # (PINYON_SHIFT_HOST_TESTS_ONLY): nothing from the disc is needed.
    if: github.event.repository.visibility == 'public'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Provision the pinned toolchain
        shell: powershell
        run: .\tools\provision-toolchain.ps1
      - name: Build and run the host tests
        shell: powershell
        run: .\tools\ci-host-tests.ps1

  android:
    # The Android runtime, GPU plugin and host tests cross-compiled with the
    # pinned NDK (AP-8.2), without game files: no generated code, no package.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the pinned NDK and Ninja
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          pins = json.load(open('config/android-toolchain.json'))['android_sdk']
          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          subprocess.run([str(sdk/'cmdline-tools/latest/bin/sdkmanager'), '--install', 'ndk;'+pins['ndk'], 'platforms;'+pins['platform']], input='y\n'*1000, text=True, check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ANDROID_NDK_HOME='+str(sdk/'ndk'/pins['ndk'])+'\n')
          PYTHON
          sudo apt-get install -y ninja-build
      - name: Check shared touch geometry and run mobile Java tests
        run: |
          python3 tools/generate-touch-icons.py --check
          python3 tools/generate-touch-artwork.py --check
          python3 tools/test-android-mobile.py
      - name: Configure for android-arm64
        run: >
          cmake --preset android-arm64-release -B out/build/android-ci
          -DPINYON_SHIFT_HOST_TESTS_ONLY=ON
          -DPYTHON_EXECUTABLE=$(command -v python3)
          -DPython3_EXECUTABLE=$(command -v python3)
      - name: Build the runtime, GPU plugin and host tests
        run: cmake --build out/build/android-ci --target rexruntime rexgpu-fh1 fh4droid_android pinyon_shift_android_ui_check pinyon_shift_host_tests -j 4
